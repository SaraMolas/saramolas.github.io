# Research projects shown as cards on the homepage (image + title only).
# Order here = order on the page.
#   title:   short, approachable question shown on the card (the Research page keeps its own headings)
#   id:      must match the {#id} after the project's heading in research.md ("Read more" jumps there)
#   card_figure: optional simplified SVG (in _includes/, made by scripts/make_card_figures.py)
#                shown on the card instead of `image`;
#                `image` is still the full figure used on the Research page
#   theme:   ai or brain — sets the colour of the venue tag (terracotta / olive)
#   paper:   optional link to the paper/thesis; paper_label changes the link text (default "Paper")

- id: diffusion-generalisation
